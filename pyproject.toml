[project]
name = "crashlink"
version = "0.0.9"
authors = [
  { name="N3rdL0rd", email="n3rdl0rd@proton.me" },
]
description = "Just another HashLink decompiler/disassembler."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["hashlink", "haxe", "decompiler", "disassembler", "reverse-engineering", "bytecode"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3.16",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Assemblers",
  "Topic :: Software Development :: Disassemblers",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Programming Language :: Python :: Free Threading :: 4 - Resilient",
  "Programming Language :: Python :: Free Threading",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Other",
  "Framework :: Pyodide",
  "Typing :: Typed",
]
license = "MIT"
dependencies = []

[project.urls]
Homepage = "https://n3rdl0rd.github.io/crashlink/"
Documentation = "https://n3rdl0rd.github.io/crashlink/getting-started"
Repository = "https://github.com/N3rdL0rd/crashlink"
Issues = "https://github.com/N3rdL0rd/crashlink/issues"
Changelog = "https://github.com/N3rdL0rd/crashlink/releases"

[project.optional-dependencies]
ci = [
  "pytest",
  "pytest-xdist",
  "ty",
  "tqdm",
  "staticjinja",
  "IPython",
  "pygments",
  "markupsafe",
  "lief",
  "capstone",
  "mcp",
  "PySide6",
  "graphviz",
  "keystone-engine",
  "griffe",
  "asv",
]
dev = [
  "crashlink[extras]",
  "crashlink[ci]",
  "ruff",
]
extras = [
  "tqdm",
  "IPython",
  "pygments",
  "lief",
  "capstone",
  "mcp",
  "PySide6",
  "graphviz",
  "keystone-engine",
  "pyelftools",
]
gui = [
  "PySide6",
  "graphviz",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["env", "local", "crashtest/runs"]

[tool.ruff.lint]
# F403/F405: star-import re-exports are a deliberate pattern in __init__ files
# and hlc; E402: capstone/lief try-import blocks must precede other imports.
ignore = ["F403", "F405", "E402"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files exist to re-export the public API.
"crashlink/__init__.py" = ["F401"]
"crashlink/decomp/__init__.py" = ["F401"]
"crashlink/decomp/opt/__init__.py" = ["F401"]

[tool.ty.environment]
python-platform = "all"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[project.scripts]
crashlink = "crashlink.__main__:main"
crashtest = "crashtest.__main__:main"

[tool.uv.build-backend]
module-name = ["crashlink", "crashtest", "hlrun"]
module-root = ""
source-exclude = ["/crashtest/runs", "/tests", "/local", "/env", "/pyhl"]
wheel-exclude = ["/crashtest/runs"]
