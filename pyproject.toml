[project]
name = "crashlink"
version = "0.0.8"
authors = [
  { name="N3rdL0rd", email="n3rdl0rd@proton.me" },
]
description = "Just another HashLink decompiler/disassembler."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Disassemblers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
license = "MIT"
dependencies = []

[project.optional-dependencies]
ci = [
  "pytest",
  "pytest-xdist",
  "ty",
  "tqdm",
  "staticjinja",
  "IPython",
  "pygments",
  "markupsafe",
  "lief",
  "capstone",
  "mcp",
  "PySide6",
  "graphviz",
  "keystone-engine",
  "griffe",
]
dev = [
  "crashlink[extras]",
  "crashlink[ci]",
  "ruff",
]
extras = [
  "tqdm",
  "IPython",
  "pygments",
  "lief",
  "capstone",
  "mcp",
  "PySide6",
  "graphviz",
  "keystone-engine",
  "pyelftools",
]
gui = [
  "PySide6",
  "graphviz",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["env", "local", "crashtest/runs"]

[tool.ruff.lint]
# F403/F405: star-import re-exports are a deliberate pattern in __init__ files
# and hlc; E402: capstone/lief try-import blocks must precede other imports.
ignore = ["F403", "F405", "E402"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files exist to re-export the public API.
"crashlink/__init__.py" = ["F401"]
"crashlink/decomp/__init__.py" = ["F401"]
"crashlink/decomp/opt/__init__.py" = ["F401"]

[tool.ty.environment]
python-platform = "all"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[project.scripts]
crashlink = "crashlink.__main__:main"
crashtest = "crashtest.__main__:main"

[tool.uv.build-backend]
module-name = ["crashlink", "crashtest", "hlrun"]
module-root = ""
source-exclude = ["/crashtest/runs", "/tests", "/local", "/env", "/pyhl"]
wheel-exclude = ["/crashtest/runs"]
