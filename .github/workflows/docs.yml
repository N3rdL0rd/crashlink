name: Deploy docs

on:
  push:
    branches: ["main"]
    paths:
      - "crashlink/**"
      - "crashtest/**"
      - "hlrun/**"
      - "docs/**"
      - "!docs/content/reference/**"
      - "!docs/build/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate API reference with griffe
        # Static AST analysis, not a runtime import - no need to install
        # PySide6/mcp/capstone/etc for this to see crashlink.gui and friends.
        run: uv run python docs/gen_reference.py

      - name: Build crashtest result dashboards
        # Reproducible from the committed crashtest/runs/*.json - no need to
        # commit the generated HTML itself.
        run: uv run python -m crashtest build

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build Docusaurus site
        working-directory: docs
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
