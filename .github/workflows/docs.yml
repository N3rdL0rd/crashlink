name: Deploy docs

on:
  push:
    branches: ["main"]
    paths:
      - "crashlink/**"
      - "crashtest/**"
      - "hlrun/**"
      - "benchmarks/**"
      - "asv.conf.json"
      - "docs/**"
      - "!docs/content/reference/**"
      - "!docs/build/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout crashlink-asv results
        # Accumulates asv result JSON across commits without spamming this
        # repo's own history - see benchmarks/ and asv.conf.json.
        uses: actions/checkout@v4
        with:
          repository: N3rdL0rd/crashlink-asv
          path: .asv-results
          token: ${{ secrets.ASV_RESULTS_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate API reference with griffe
        # Static AST analysis, not a runtime import - no need to install
        # PySide6/mcp/capstone/etc for this to see crashlink.gui and friends.
        run: uv run python docs/gen_reference.py

      - name: Build crashtest result dashboards
        # Reproducible from the committed crashtest/runs/*.json - no need to
        # commit the generated HTML itself.
        run: uv run python -m crashtest build

      - name: Cache benchmark fixtures
        id: cache-hl
        uses: actions/cache@v4
        with:
          path: tests/haxe/*.hl
          key: haxe-samples-${{ hashFiles('tests/haxe/*.hx') }}

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Build benchmark fixtures
        if: steps.cache-hl.outputs.cache-hit != 'true'
        run: |
          bash -c 'set -e; cd tests/haxe; for f in *.hx; do haxe -hl "${f%.*}.hl" -main "${f%.*}"; done'

      - name: Register asv machine
        run: uv run asv machine --yes --machine gh-actions

      - name: Run benchmarks for each pushed commit
        # environment_type "existing" only benchmarks the installed checkout, so
        # walk the push by checking out each commit (uv installs crashlink
        # editable). Skips commits that can't move a result, caps the count to
        # bound CI time, and falls back to HEAD alone when the push base is
        # unknown (new branch, force-push).
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          commits=""
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            commits=$(git rev-list --reverse "$BEFORE..$AFTER" -- crashlink benchmarks asv.conf.json | tail -n 5)
          fi
          for sha in ${commits:-$AFTER}; do
            git checkout -q "$sha"
            uv run --no-sync asv run --machine gh-actions --set-commit-hash "$sha" --show-stderr \
              || echo "::warning::benchmarks failed at $sha"
          done
          git checkout -q "$AFTER"

      - name: Commit updated benchmark results
        working-directory: .asv-results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "No new benchmark results"
          else
            git commit -m "chore: benchmark results for ${{ github.sha }}"
            git push
          fi

      - name: Publish benchmark dashboard
        run: uv run asv publish

      - name: Stage benchmark dashboard into docs static tree
        run: |
          mkdir -p docs/static/benchmarks
          cp -r .asv/html/. docs/static/benchmarks/

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build Docusaurus site
        working-directory: docs
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
