# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests/Linting

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --extra ci --extra dev

    - name: Cache test samples
      id: cache-hl
      uses: actions/cache@v4
      with:
        path: tests/haxe/*.hl
        key: haxe-samples-${{ hashFiles('tests/haxe/*.hx') }}

    - name: Set up Haxe
      if: steps.cache-hl.outputs.cache-hit != 'true'
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.3.4

    - name: Build test samples
      if: steps.cache-hl.outputs.cache-hit != 'true'
      run: |
        bash -c 'cd tests/haxe && for f in *.hx; do haxe -hl "${f%.*}.hl" -main "$f"; done'

    - name: Check formatting with ruff
      run: |
        uv run ruff format --check

    - name: Lint with ruff
      run: |
        uv run ruff check

    - name: Test with pytest
      run: |
        uv run pytest

    - name: Check with ty
      run: |
        uv run ty check
