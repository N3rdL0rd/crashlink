# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests/Linting

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --extra ci --extra dev

    - name: Cache test samples
      id: cache-hl
      uses: actions/cache@v4
      with:
        path: tests/haxe/*.hl
        key: haxe-samples-${{ hashFiles('tests/haxe/*.hx') }}

    - name: Set up Haxe
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.3.4

    - name: Build test samples
      if: steps.cache-hl.outputs.cache-hit != 'true'
      run: |
        bash -c 'set -e; cd tests/haxe; for f in *.hx; do haxe -hl "${f%.*}.hl" -main "${f%.*}"; done'

    - name: Check formatting with ruff
      run: |
        uv run ruff format --check

    - name: Lint with ruff
      run: |
        uv run ruff check

    - name: Test with pytest
      run: |
        uv run pytest

    - name: Check with ty
      run: |
        uv run ty check

  behavioral-native:
    runs-on: ubuntu-latest
    env:
      CRASHLINK_REQUIRE_QUALITY: "1"
    steps:
    - uses: actions/checkout@v4
    - name: Compute runner-relative paths
      run: |
        echo "CRASHLINK_QUALITY_DIR=$RUNNER_TEMP/crashlink-quality" >> "$GITHUB_ENV"
        echo "HL_SOURCE=$RUNNER_TEMP/hashlink" >> "$GITHUB_ENV"
        echo "HL_LIBRARY_DIR=$RUNNER_TEMP/hashlink/build/bin" >> "$GITHUB_ENV"
        echo "HL_RUNTIME=$RUNNER_TEMP/hashlink/build/bin/hl" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/hashlink/build/bin" >> "$GITHUB_ENV"
    - uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.13"
    - uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.3.4
    - name: Install Python and native toolchains
      run: |
        uv sync --extra ci --extra dev
        sudo apt-get update
        sudo apt-get install -y build-essential cmake
    - name: Build real HashLink runtime
      run: |
        git clone --depth 1 --branch 1.15 https://github.com/HaxeFoundation/hashlink.git "$HL_SOURCE"
        cmake -S "$HL_SOURCE" -B "$HL_SOURCE/build" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DWITH_FMT=OFF -DWITH_OPENAL=OFF -DWITH_SDL=OFF -DWITH_SQLITE=OFF -DWITH_SSL=OFF -DWITH_UI=OFF -DWITH_UV=OFF -DWITH_VIDEO=OFF -DWITH_HEAPS=OFF
        cmake --build "$HL_SOURCE/build" --target hl libhl --parallel 2
    - name: Build shipped bytecode and native corpus
      run: uv run python tests/quality/build.py --out "$CRASHLINK_QUALITY_DIR" --native
    - name: Require behavioral and native regression coverage
      run: uv run pytest -q tests/test_crashtest_behavior.py tests/test_dehlc_native_corpus.py
    - name: Exercise crashtest CLI behavioral verdict
      run: uv run python -m crashtest run "$CRASHLINK_QUALITY_DIR/QualityConstants.hx" --no-decompiled --no-diff
